<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>School Hisaab</title>
<style>
:root{--bg:#f4f6f9;--cd:#fff;--tx:#1b2430;--mu:#5f6b7a;--bd:#d9e0e8;--pr:#1f4e78;--pt:#fff;--ok:#1a7f4b;--bad:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171d;--cd:#1c242d;--tx:#e8edf2;--mu:#9aa7b5;--bd:#2d3945;--pr:#5aa0d6;--pt:#0d1822;--ok:#4cc38a;--bad:#ff7b6b}}
:root[data-theme="dark"]{--bg:#12171d;--cd:#1c242d;--tx:#e8edf2;--mu:#9aa7b5;--bd:#2d3945;--pr:#5aa0d6;--pt:#0d1822;--ok:#4cc38a;--bad:#ff7b6b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;padding-bottom:70px}
main{max-width:980px;margin:0 auto;padding:12px}
h1{font-size:19px;margin:4px 0 10px}h2{font-size:16px;margin:0 0 8px}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.r{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
label{font-size:12px;color:var(--mu);display:block}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;width:100%}
button{background:var(--pr);color:var(--pt);border:0;font-weight:600;cursor:pointer;width:auto;padding:9px 16px}
button.g{background:transparent;color:var(--bad);padding:4px 8px}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}th{color:var(--mu);font-weight:600}
tr.t td{font-weight:700;border-top:2px solid var(--bd)}
td input,td select{padding:4px;width:90px}
.big{font-size:24px;font-weight:700;color:var(--pr)}.mu{color:var(--mu);font-size:12px}.bad{color:var(--bad)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav a{flex:1;text-align:center;padding:8px 2px;font-size:11px;color:var(--mu);cursor:pointer}
nav a b{display:block;font-size:18px;font-weight:400}nav a.on{color:var(--pr);font-weight:700}
nav{overflow-x:auto}nav a{min-width:66px}
.paper{background:#fff;color:#111}.paper .bad{color:#c0392b}
.rz{font-size:12px}.rz th,.rz td{border:1px solid #444;text-align:center;padding:4px 3px;white-space:normal;color:#111;background:#fff}
.rz th{background:#fde9d9;font-size:11px}.rz input{background:transparent;color:#111;border:0;width:100%;min-width:42px;text-align:center;padding:3px;border-radius:0}
.rz .cp{background:#f8d7da}.rz .cy{background:#fff2b3}.rz .cg{background:#c9e8c9}.rz tr.cx td{background:#ddd}
.bar{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mu);margin-bottom:6px}
.pad{display:none}
@page{size:A4 portrait;margin:10mm}
@media print{nav,.np{display:none}body{background:#fff;padding:0}main{max-width:none;padding:0}.c{border:0;padding:0}.pad{display:table-row}.rz td{height:25px}}
</style></head><body>
<main id="app"></main><nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s),V=id=>$("#"+id).value;
const E=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const N=v=>Math.round(+v||0).toLocaleString("en-US");
const S={cfg:{},exp:{},att:{},adv:{},roz:{}};let db=null,tab="home";
const pd=n=>String(n).padStart(2,"0"),ymd=d=>d.getFullYear()+"-"+pd(d.getMonth()+1)+"-"+pd(d.getDate()),hm=d=>pd(d.getHours())+":"+pd(d.getMinutes());
let off=0;const now=()=>new Date(Date.now()+off),T0=()=>ymd(now()),stamp=()=>{const d=now();return ymd(d)+" "+hm(d)};
const fmtAt=a=>{if(!a)return "";const p=a.split(" "),q=p[0].split("-");return q[2]+"-"+MN[+q[1]-1]+" "+t12(p[1])};
const fmtNow=()=>{const d=now();return ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getDay()]+" "+pd(d.getDate())+"-"+MN[d.getMonth()]+"-"+d.getFullYear()+" "+t12(hm(d)).replace(/(\d+:\d+)/,"$1:"+pd(d.getSeconds()))};
try{if(location.protocol.indexOf("http")==0)fetch(location.href,{method:"HEAD",cache:"no-store"}).then(r=>{const h=r.headers.get("date");if(h)off=new Date(h)-Date.now()}).catch(()=>{})}catch(e){}
let today=T0();let ym=today.slice(0,7),yr=today.slice(0,4),ad=today;
const DEF={days:30,start:"08:00",grace:10,end:"14:00",free:0,heads:"Utility Bills,Stationery & Printing,Repair & Maintenance,Furniture & Equipment,Events & Functions,Cleaning & Security,Transport / Fuel,Books & Teaching Aids,Miscellaneous",school:"The Stars Modal High School",code:"07-lhr-0110",prog:"PEF Students"};
const cfg=()=>Object.assign({},DEF,S.cfg.settings||{});
const classes=()=>(S.cfg.classes&&S.cfg.classes.rows)||[];
const t12=t=>{if(!t)return "-";const p=t.split(":"),h=+p[0];return (h%12||12)+":"+p[1]+" "+(h<12?"AM":"PM")};
let ns=null,rd=today,me=null;
const users=()=>(S.cfg.users&&S.cfg.users.rows)||[];
const isAdmin=()=>!!me&&me.role=="admin";
const adm=()=>{if(isAdmin())return true;alert("Sirf Admin delete ya badal sakta hai");return false};
const ro=v=>(!isAdmin()&&v!=null&&v!=="")?" readonly":"";
async function H(p,u){const s="sh1|"+u+"|"+p;if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))|0;return "f"+h}
const okU=u=>/^[a-z0-9._-]{3,}$/.test(u);
const staff=()=>(S.cfg.staff&&S.cfg.staff.rows)||[];
const rows=(c,k)=>(S[c][k]&&S[c][k].rows)||[];
const mn=t=>{if(!t)return 0;const p=t.split(":");return p[0]*60+ +p[1]};
function save(c,id,o,nr){S[c][id]=o;
  if(db)db.doc(c+"/"+id).set(o).catch(e=>alert("Save nahi hua: "+(e.message||e)));
  else try{localStorage.setItem("sx:"+c+"/"+id,JSON.stringify(o))}catch(e){}
  if(!nr)render(true)}
const lateMin=(t,c)=>t?Math.max(0,mn(t)-(mn(c.start)+ +c.grace)):0;
const earlyMin=(t,c)=>t?Math.max(0,mn(c.end)-mn(t)):0;
function calc(m){const c=cfg(),duty=(mn(c.end)-mn(c.start))/60,A=rows("att",m),adv=(S.adv[m]&&S.adv[m].m)||{};
  return staff().map(s=>{let lv=0,late=0,early=0;
    A.filter(a=>a.sid==s.id).forEach(a=>{if(a.status=="Absent"||a.status=="Leave")lv+=1;else if(a.status=="Half Day")lv+=.5;
      else if(a.status=="Present"){late+=lateMin(a.tin,c);early+=earlyMin(a.tout,c)}});
    const pd=s.salary/c.days,ld=Math.round(Math.max(0,lv-c.free)*pd),td=duty>0?Math.round((late+early)/60*pd/duty):0,av=+adv[s.id]||0;
    return{s,lv,late,early,ld,td,av,net:Math.max(0,s.salary-ld-td-av)}})}
const mk=i=>yr+"-"+String(i+1).padStart(2,"0");
const MN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function home(){const hs=cfg().heads.split(",").map(x=>x.trim()).filter(Boolean),ms=[...Array(12)].map((_,i)=>mk(i));
  ms.forEach(m=>rows("exp",m).forEach(r=>{if(hs.indexOf(r.head)<0)hs.push(r.head)}));
  const d=[["Salaries (Staff)",ms.map(m=>(S.att[m]||S.adv[m])?calc(m).reduce((a,r)=>a+r.net,0):0)]]
    .concat(hs.map(h=>[h,ms.map(m=>rows("exp",m).filter(r=>r.head==h).reduce((a,r)=>a+ +r.amt,0))]));
  const sm=a=>a.reduce((x,y)=>x+y,0),T=sm(d.map(x=>sm(x[1])));
  return `<h1>Hisaab (Summary)</h1><div class="c"><label>Saal</label><input type="number" value="${yr}" onchange="yr=this.value;render(true)" style="width:110px">
  <div class="mu" style="margin-top:8px">Total kharcha</div><div class="big">Rs. ${N(T)}</div></div>
  <div class="c w"><table><tr><th>Head</th><th>Total</th><th>%</th>${MN.map(m=>`<th>${m}</th>`).join("")}</tr>
  ${d.map(x=>`<tr><td>${E(x[0])}</td><td><b>${N(sm(x[1]))}</b></td><td>${T?(sm(x[1])/T*100).toFixed(1):0}%</td>${x[1].map(v=>`<td>${v?N(v):"-"}</td>`).join("")}</tr>`).join("")}
  <tr class="t"><td>TOTAL</td><td>${N(T)}</td><td>100%</td>${ms.map((_,i)=>`<td>${N(sm(d.map(x=>x[1][i])))}</td>`).join("")}</tr></table></div>
  <div class="mu">Salaries ka kharcha Salary tab se khud aata hai (hazri aur katauti ke baad).</div>`}
function kharcha(){const hs=cfg().heads.split(",").map(x=>x.trim()).filter(Boolean),L=rows("exp",ym),T=L.reduce((a,r)=>a+ +r.amt,0);
  return `<h1>Kharcha darj karein</h1><div class="c"><div class="r">
  <div><label>Date</label><input id="d" type="date" value="${today}"${isAdmin()?"":" disabled"}></div>
  <div><label>Head</label><select id="h">${hs.map(h=>`<option>${E(h)}</option>`).join("")}</select></div>
  <div><label>Kis ko / Party</label><input id="p"></div><div><label>Tafseel</label><input id="e"></div>
  <div><label>Amount (Rs.)</label><input id="a" type="number" inputmode="decimal"></div>
  <div><label>Payment</label><select id="o"><option>Cash</option><option>Bank Transfer</option><option>Cheque</option><option>Online</option></select></div></div>
  <p><button onclick="addExp()">Save karein</button></p></div>
  <div class="c"><label>Mahina</label><input type="month" value="${ym}"${isAdmin()?"":" disabled"} onchange="ym=this.value;render(true)" style="width:170px">
  <div class="mu" style="margin-top:6px">Is mahine ka total: <b>Rs. ${N(T)}</b></div>
  <div class="w"><table><tr><th>Date</th><th>Head</th><th>Party</th><th>Tafseel</th><th>Amount</th><th>Entry by</th><th>Entry waqt</th><th></th></tr>
  ${L.sort((a,b)=>a.date<b.date?1:-1).map(r=>`<tr><td>${r.date}</td><td>${E(r.head)}</td><td>${E(r.party)}</td><td>${E(r.desc)}</td><td>${N(r.amt)}</td><td>${E(r.by||"")}</td><td>${fmtAt(r.at)}</td><td>${isAdmin()?`<button class="g" onclick="delExp(${r.id})">✕</button>`:""}</td></tr>`).join("")||'<tr><td colspan="8">Koi entry nahi</td></tr>'}</table></div></div>`}
function addExp(){const dt=isAdmin()?V("d"):T0();if(!dt||!+V("a"))return alert("Date aur amount likhein");const m=dt.slice(0,7),r=rows("exp",m).slice();
  r.push({id:Date.now(),date:dt,head:V("h"),party:V("p"),desc:V("e"),amt:+V("a"),mode:V("o"),by:me.name,at:stamp()});ym=m;save("exp",m,{rows:r})}
function delExp(id){if(!adm())return;if(confirm("Ye entry delete karein?"))save("exp",ym,{rows:rows("exp",ym).filter(r=>r.id!=id)})}
function hazri(){const c=cfg(),m=ad.slice(0,7),A=rows("att",m).filter(a=>a.date==ad),st=staff();
  const done=id=>A.some(a=>a.sid==id),rest=st.filter(s=>!done(s.id)),sel=st.some(s=>s.id==ns)?ns:(rest[0]||st[0]||{}).id;
  return `<h1>Roz ki Hazri</h1><div class="c"><label>Date</label><input type="date" value="${ad}"${isAdmin()?"":" disabled"} onchange="ad=this.value;ns=null;render(true)" style="width:170px">
  <div class="mu" style="margin-top:6px">Start ${t12(c.start)}, grace ${c.grace} min, end ${t12(c.end)}.</div></div>
  ${st.length?`<div class="c"><h2>Hazri add karein</h2><div class="r">
  <div><label>Teacher / Staff</label><select id="as" style="width:100%">${st.map(s=>`<option value="${s.id}"${s.id==sel?" selected":""}>${E(s.name)}${done(s.id)?" ✓":""}</option>`).join("")}</select></div>
  <div><label>Status</label><select id="ast" style="width:100%">${["Present","Absent","Leave","Half Day","Paid Leave"].map(x=>`<option>${x}</option>`).join("")}</select></div>
  ${isAdmin()?`<div><label>Time In</label><input id="ai" type="time" value="${c.start}"></div><div><label>Time Out</label><input id="au" type="time" value="${c.end}"></div>`:`<div><label>Time</label><input readonly value="Abhi ka time khud lagega"></div>`}</div>
  <p><button onclick="addAtt()">${isAdmin()?"Add karein":"Add / Time Out lagayein"}</button> ${isAdmin()?`<button onclick="allPresent()" style="background:var(--ok)">Baqi sab Present</button>`:""}</p>${isAdmin()?"":`<div class="mu">Date aur time system se khud lagte hain. Pehli dafa Add = Time In, dobara Add (Present) = Time Out.</div>`}
  <div class="mu">Abhi baqi: ${rest.length?E(rest.map(s=>s.name).join(", ")):"koi nahi"}</div></div>
  <div class="c w"><h2>${ad} ki hazri</h2><table><tr><th>Teacher</th><th>Status</th><th>Time In</th><th>Time Out</th><th>Late+Early</th><th>Entry by</th><th>Entry waqt</th><th></th></tr>
  ${st.filter(s=>done(s.id)).map(s=>{const a=A.find(x=>x.sid==s.id),lt=a.status=="Present"?lateMin(a.tin,c)+earlyMin(a.tout,c):0;
  return `<tr><td>${E(s.name)}</td><td>${a.status}</td><td>${t12(a.tin)}</td><td>${t12(a.tout)}</td><td class="${lt?"bad":""}">${lt?lt+" min":"-"}</td><td>${E(a.by||"")}</td><td>${fmtAt(a.at)}</td><td>${isAdmin()?`<button class="g" onclick="delAtt(${s.id})">✕</button>`:""}</td></tr>`}).join("")||'<tr><td colspan="8">Is date ki abhi koi hazri nahi</td></tr>'}</table></div>`:'<div class="c">Pehle Staff tab me staff add karein.</div>'}`}
function putAtt(r,sid,st,tin,tout){const p=st=="Present",o={date:ad,sid:sid,status:st,tin:p?tin:"",tout:p?tout:"",by:me.name,at:stamp()},i=r.findIndex(a=>a.date==ad&&a.sid==sid);if(i<0)r.push(o);else r[i]=o}
function addAtt(){if(!isAdmin())ad=T0();const m=ad.slice(0,7),r=rows("att",m).slice(),sid=+V("as");if(!sid)return;const i=r.findIndex(a=>a.date==ad&&a.sid==sid),nw=hm(now());
  if(isAdmin())putAtt(r,sid,V("ast"),V("ai"),V("au"));
  else if(i<0)putAtt(r,sid,V("ast"),nw,"");
  else{const x=r[i];if(x.status=="Present"&&!x.tout&&V("ast")=="Present")r[i]=Object.assign({},x,{tout:nw});else return alert("Is teacher ki hazri pehle se lag chuki hai. Sirf Admin badal sakta hai.")}
  const rest=staff().filter(s=>s.id!=sid&&!r.some(a=>a.date==ad&&a.sid==s.id));ns=rest.length?rest[0].id:sid;save("att",m,{rows:r})}
function allPresent(){if(!isAdmin())return;const m=ad.slice(0,7),r=rows("att",m).slice(),c=cfg();staff().forEach(s=>{if(!r.some(a=>a.date==ad&&a.sid==s.id))putAtt(r,s.id,"Present",c.start,c.end)});save("att",m,{rows:r})}
function delAtt(sid){if(!adm())return;const m=ad.slice(0,7);save("att",m,{rows:rows("att",m).filter(a=>!(a.date==ad&&a.sid==sid))})}
function roz(){const c=cfg(),C=classes(),D=((S.roz[rd.slice(0,7)]||{}).d||{})[rd]||{};
  const dp=`<div class="c np"><label>Date</label><input type="date" value="${rd}"${isAdmin()?"":" disabled"} onchange="rd=this.value;render(true)" style="width:170px">
  <div class="mu" style="margin-top:6px">Class, Total Boys aur Total Girls Settings tab se badalte hain. Yahan sirf Present Boys, Present Girls aur Remarks likhein.</div></div>`;
  if(!C.length)return `<h1>Daily Roznamcha</h1>${dp}<div class="c">Pehle Settings tab me classes (Class, Total Boys, Total Girls) add karein.</div>`;
  const cell=(k,id,v)=>`<td><input type="number" min="0" inputmode="numeric" data-k="${k}" data-id="${id}" value="${v==null?"":v}"${ro(v)} oninput="rozUpd()" onchange="rozSave()"></td>`;
  const body=C.map((k,i)=>{const d=D[k.id]||{};return `<tr><td>${i+1}</td><td class="cp"><b>${E(k.name)}</b></td><td>${k.boys}</td><td>${k.girls}</td><td class="cy">${+k.boys+ +k.girls}</td>${cell("pb",k.id,d.pb)}${cell("pg",k.id,d.pg)}<td class="cg" id="tp${k.id}"></td><td id="ag${k.id}"></td><td id="ab${k.id}"></td><td class="cy" id="ta${k.id}"></td><td><input type="text" data-k="rem" data-id="${k.id}" value="${E(d.rem||"")}"${ro(d.rem)} onchange="rozSave()" style="text-align:left"></td></tr>`}).join("");
  const pad=[...Array(Math.max(0,22-C.length))].map((_,i)=>`<tr class="pad"><td>${C.length+i+1}</td>${"<td></td>".repeat(11)}</tr>`).join("");
  return `<h1 class="np">Daily Roznamcha (Students)</h1>${dp}<div class="c w paper"><div style="text-align:center;font-size:18px;font-weight:700;margin-bottom:6px">Daily Roznamcha</div>
  <div style="display:flex;justify-content:space-between;gap:8px;font-size:12px;margin-bottom:6px;flex-wrap:wrap"><span>School Name: <b>${E(c.school)}</b></span><span>School Code: <b>${E(c.code)}</b></span></div>
  <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px"><b>${E(c.prog)}</b><span>Date: <b>${rd.split("-").reverse().join("-")}</b></span></div>
  <table class="rz"><tr><th>Ser#</th><th class="cp">Class</th><th>Total Boys</th><th>Total Girls</th><th class="cy">Total Students</th><th>Present Boys</th><th>Present Girls</th><th class="cg">Total Present</th><th>Absent Girls</th><th>Absent Boys</th><th class="cy">Total Absent</th><th style="min-width:110px">Remarks</th></tr>
  ${body}${pad}<tr class="cx"><td colspan="2"><b>Total</b></td><td id="Tb"></td><td id="Tg"></td><td id="Tt"></td><td id="Tpb"></td><td id="Tpg"></td><td id="Ttp"></td><td id="Tag"></td><td id="Tab"></td><td id="Tta"></td><td></td></tr></table>
  <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:26px;font-size:12px"><span>Incharge Signature: ______________________</span><span>Principal Signature: ______________________</span></div></div>
  <div class="mu np" id="rm">${D._m?"Aakhri entry: "+E(D._m.by)+" — "+fmtAt(D._m.at):""}</div><p class="np"><button onclick="print()">Print karein (A4)</button></p>`}
const qi=(k,id)=>document.querySelector('[data-k="'+k+'"][data-id="'+id+'"]');
function rozUpd(){const T={b:0,g:0,pb:0,pg:0,ag:0,ab:0};
  classes().forEach(k=>{const a=qi("pb",k.id).value,b=qi("pg",k.id).value,has=a!==""||b!=="",pb=+a||0,pg=+b||0,ab=k.boys-pb,ag=k.girls-pg;T.b+=+k.boys;T.g+=+k.girls;
    const set=(i,v)=>{const e=document.getElementById(i+k.id);e.textContent=has?v:"";e.classList.toggle("bad",has&&v<0)};
    set("tp",pb+pg);set("ag",ag);set("ab",ab);set("ta",ab+ag);if(has){T.pb+=pb;T.pg+=pg;T.ag+=ag;T.ab+=ab}});
  const t={Tb:T.b,Tg:T.g,Tt:T.b+T.g,Tpb:T.pb,Tpg:T.pg,Ttp:T.pb+T.pg,Tag:T.ag,Tab:T.ab,Tta:T.ag+T.ab};for(const i in t)document.getElementById(i).textContent=t[i]}
function rozSave(){const m=rd.slice(0,7),o=JSON.parse(JSON.stringify(S.roz[m]||{}));o.d=o.d||{};const d=o.d[rd]={};
  classes().forEach(k=>{d[k.id]={pb:qi("pb",k.id).value,pg:qi("pg",k.id).value,rem:qi("rem",k.id).value}});d._m={by:me.name,at:stamp()};$("#rm").textContent="Aakhri entry: "+me.name+" — "+fmtAt(d._m.at);save("roz",m,o,true)}
function classesV(){return `<div class="c"><h2>Roznamcha ki Classes</h2><div class="mu" style="margin-bottom:8px">Class ka naam, Total Boys aur Total Girls yahan se badalte hain (max 22). Total Students khud banta hai. Roznamcha me ye columns fixed rehte hain.</div>
  <div class="w"><table><tr><th>Ser#</th><th>Class</th><th>Total Boys</th><th>Total Girls</th><th>Total Students</th><th></th></tr>
  ${classes().map((k,i)=>`<tr><td>${i+1}</td><td><input value="${E(k.name)}" style="width:130px" onchange="setCls(${k.id},'name',this.value)"></td><td><input type="number" value="${k.boys}" onchange="setCls(${k.id},'boys',this.value)"></td><td><input type="number" value="${k.girls}" onchange="setCls(${k.id},'girls',this.value)"></td><td>${+k.boys+ +k.girls}</td><td><button class="g" onclick="delCls(${k.id})">✕</button></td></tr>`).join("")}</table></div>
  <div class="r" style="margin-top:8px"><div><label>Class</label><input id="cn"></div><div><label>Total Boys</label><input id="cbi" type="number"></div><div><label>Total Girls</label><input id="cgi" type="number"></div></div>
  <p><button onclick="addCls()">Class add karein</button></p></div>`}
function setCls(id,f,v){save("cfg","classes",{rows:classes().map(k=>{if(k.id!=id)return k;const o=Object.assign({},k);o[f]=f=="name"?v:(+v||0);return o})})}
function addCls(){if(!V("cn"))return alert("Class ka naam likhein");if(classes().length>=22)return alert("Max 22 classes");save("cfg","classes",{rows:classes().concat([{id:Date.now(),name:V("cn"),boys:+V("cbi")||0,girls:+V("cgi")||0}])})}
function delCls(id){if(!adm())return;if(confirm("Class delete karein?"))save("cfg","classes",{rows:classes().filter(k=>k.id!=id)})}
function salary(){const R=calc(ym),sm=k=>R.reduce((a,r)=>a+r[k],0),T=R.reduce((a,r)=>a+r.net,0);
  return `<h1>Salary (katauti ke baad)</h1><div class="c np"><label>Mahina</label><input type="month" value="${ym}" onchange="ym=this.value;render(true)" style="width:170px"></div>
  <div class="c"><div class="mu">${ym} ki kul net salary</div><div class="big">Rs. ${N(T)}</div></div>
  <div class="c w"><table><tr><th>Staff</th><th>Salary</th><th>Leave din</th><th>Late+Early min</th><th>Leave katauti</th><th>Time katauti</th><th>Advance</th><th>NET</th></tr>
  ${R.map(r=>`<tr><td>${E(r.s.name)}</td><td>${N(r.s.salary)}</td><td>${r.lv}</td><td>${r.late+r.early}</td><td>${N(r.ld)}</td><td>${N(r.td)}</td>
  <td class="np"><input type="number" value="${r.av||""}" onchange="setAdv(${r.s.id},this.value)"></td><td><b>${N(r.net)}</b></td></tr>`).join("")||'<tr><td colspan="8">Staff add karein</td></tr>'}
  <tr class="t"><td>TOTAL</td><td>${N(sm("ld")*0+R.reduce((a,r)=>a+r.s.salary,0))}</td><td></td><td></td><td>${N(sm("ld"))}</td><td>${N(sm("td"))}</td><td>${N(sm("av"))}</td><td>${N(T)}</td></tr></table></div>
  <p class="np"><button onclick="print()">Print karein</button></p>
  <div class="mu">Katauti: leave = (leave − free) × per-day rate; time = (late+early) ÷ 60 × per-hour rate. Qaide Settings me hain.</div>`}
function setAdv(id,v){const m=Object.assign({},(S.adv[ym]&&S.adv[ym].m)||{});m[id]=+v||0;save("adv",ym,{m})}
function staffV(){return `<h1>Staff</h1><div class="c"><div class="r"><div><label>Naam</label><input id="n"></div><div><label>Designation</label><input id="g"></div>
  <div><label>Monthly salary</label><input id="m" type="number" inputmode="decimal"></div></div><p><button onclick="addStaff()">Staff add karein</button></p></div>
  <div class="c w"><table><tr><th>Naam</th><th>Designation</th><th>Salary</th><th></th></tr>
  ${staff().map(s=>`<tr><td>${E(s.name)}</td><td>${E(s.desig)}</td><td><input type="number" value="${s.salary}" onchange="setSal(${s.id},this.value)"></td><td><button class="g" onclick="delStaff(${s.id})">✕</button></td></tr>`).join("")||'<tr><td colspan="4">Koi staff nahi</td></tr>'}</table></div>`}
function addStaff(){if(!V("n")||!+V("m"))return alert("Naam aur salary likhein");save("cfg","staff",{rows:staff().concat([{id:Date.now(),name:V("n"),desig:V("g"),salary:+V("m")}])})}
function setSal(id,v){save("cfg","staff",{rows:staff().map(s=>s.id==id?Object.assign({},s,{salary:+v||0}):s)})}
function delStaff(id){if(!adm())return;if(confirm("Staff delete karein? Un ki purani hazri bhi hisab se nikal jayegi."))save("cfg","staff",{rows:staff().filter(s=>s.id!=id)})}
function sett(){const c=cfg();return `<h1>Settings</h1><div class="c"><div class="r">
  <div><label>Mahine ke din</label><input id="k1" type="number" value="${c.days}"></div><div><label>School start</label><input id="k2" type="time" value="${c.start}"></div>
  <div><label>Grace (minutes)</label><input id="k3" type="number" value="${c.grace}"></div><div><label>School end</label><input id="k4" type="time" value="${c.end}"></div>
  <div><label>Free chhuttiyan / mahina</label><input id="k5" type="number" step="0.5" value="${c.free}"></div></div>
  <div class="r" style="margin-top:8px"><div><label>School ka naam (Roznamcha)</label><input id="k7" value="${E(c.school)}"></div><div><label>School Code</label><input id="k8" value="${E(c.code)}"></div><div><label>Programme</label><input id="k9" value="${E(c.prog)}"></div></div>
  <label style="margin-top:10px">Kharcha heads (comma se alag karein)</label><textarea id="k6" rows="4">${E(c.heads)}</textarea>
  <p><button onclick="saveSet()">Save karein</button></p></div>
  ${classesV()}<div class="c"><h2>Backup / Restore</h2><div class="mu" style="margin-bottom:8px">Data isi device ke browser me save hota hai. Dosre computer ya mobile par le jane ke liye yahan se Backup file bana kar wahan Restore karein. Hafte me aik dafa Backup zaroor lein.</div>
  <button onclick="backup()">Backup download karein</button>
  <label style="margin-top:12px">Backup se Restore karein (file chunein)</label><input type="file" accept=".json" onchange="restore(this)"></div>`}
function backup(){const b=new Blob([JSON.stringify(S)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="school-hisaab-backup-"+today+".json";a.click()}
function restore(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!confirm("Ye is device ka mojooda data replace kar dega. Jaari rakhein?"))return;
  Object.keys(localStorage).filter(k=>k.indexOf("sx:")==0).forEach(k=>localStorage.removeItem(k));
  ["cfg","exp","att","adv","roz"].forEach(c=>{S[c]={};Object.keys(o[c]||{}).forEach(id=>save(c,id,o[c][id]))});alert("Restore ho gaya")}catch(e){alert("Backup file sahi nahi hai")}};r.readAsText(f)}
function saveSet(){save("cfg","settings",{days:+V("k1")||30,start:V("k2"),grace:+V("k3")||0,end:V("k4"),free:+V("k5")||0,heads:V("k6"),school:V("k7"),code:V("k8"),prog:V("k9")});alert("Settings save ho gayin")}
function setupV(){return `<h1>School Hisaab — Pehli dafa setup</h1><div class="c"><div class="mu" style="margin-bottom:8px">Admin account banayein. Sirf Admin hi baad me dosre users bana sakta hai. Admin ka password yaad rakhein.</div>
  <div class="r"><div><label>Naam</label><input id="sn"></div><div><label>Username (a-z, 0-9)</label><input id="su" autocapitalize="none"></div><div><label>Password (kam az kam 4)</label><input id="sp" type="password"></div><div><label>Password dobara</label><input id="sq" type="password"></div></div>
  <p><button onclick="doSetup()">Admin banayein</button></p></div><div class="c"><div class="mu">Kisi dosre device ka Backup hai to yahan restore karein:</div><input type="file" accept=".json" onchange="restore(this)"></div>`}
async function doSetup(){const n=V("sn").trim(),u=V("su").trim().toLowerCase(),p=V("sp");if(!n||!okU(u))return alert("Naam likhein aur username (kam az kam 3 harf/number) likhein");
  if(p.length<4||p!=V("sq"))return alert("Password kam az kam 4 harf ka ho aur dono baar same ho");
  const o={id:"u"+Date.now(),name:n,username:u,hash:await H(p,u),role:"admin"};me=o;sessionStorage.setItem("sx_sess",o.id);save("cfg","users",{rows:[o]})}
function loginV(){return `<h1>School Hisaab — Login</h1><div class="c"><label>Username</label><input id="lu" autocapitalize="none" autocomplete="username">
  <label style="margin-top:8px">Password</label><input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')doLogin()">
  <label style="margin-top:10px"><input type="checkbox" id="lr" style="width:auto"> Is device par yaad rakhein</label><p><button onclick="doLogin()">Login</button></p></div>`}
async function doLogin(){const u=V("lu").trim().toLowerCase(),rem=$("#lr").checked,h=await H(V("lp"),u),x=users().find(a=>a.username==u&&a.hash==h);
  if(!x)return alert("Username ya password galat hai");(rem?localStorage:sessionStorage).setItem("sx_sess",x.id);me=x;tab="home";render(true)}
function logout(){sessionStorage.removeItem("sx_sess");localStorage.removeItem("sx_sess");me=null;render(true)}
function usersV(){return `<h1>Users (Login)</h1><div class="c"><h2>Naya user banayein</h2><div class="r"><div><label>Naam</label><input id="un"></div><div><label>Username</label><input id="uu" autocapitalize="none"></div>
  <div><label>Password</label><input id="up"></div><div><label>Role</label><select id="ur" style="width:100%"><option value="staff">Staff</option><option value="admin">Admin</option></select></div></div>
  <p><button onclick="addUser()">User banayein</button></p><div class="mu">Staff user sirf Kharcha, Hazri aur Roznamcha ki entry kar sakta hai. Wo kuch delete nahi kar sakta aur save ki hui entry badal nahi sakta. Admin sab kuch kar sakta hai.</div></div>
  <div class="c w"><table><tr><th>Naam</th><th>Username</th><th>Role</th><th></th></tr>${users().map(u=>`<tr><td>${E(u.name)}</td><td>${E(u.username)}</td><td>${u.role=="admin"?"Admin":"Staff"}</td><td><button class="g" style="color:var(--pr)" onclick="pwUser('${u.id}')">Password</button>${u.id==me.id?"":`<button class="g" onclick="delUser('${u.id}')">✕</button>`}</td></tr>`).join("")}</table></div>`}
async function addUser(){if(!isAdmin())return;const n=V("un").trim(),u=V("uu").trim().toLowerCase(),p=V("up");if(!n||!okU(u))return alert("Naam aur username (kam az kam 3 harf/number, space nahi) likhein");
  if(p.length<4)return alert("Password kam az kam 4 harf ka ho");if(users().some(x=>x.username==u))return alert("Ye username pehle se maujood hai");
  save("cfg","users",{rows:users().concat([{id:"u"+Date.now(),name:n,username:u,hash:await H(p,u),role:V("ur")}])})}
async function pwUser(id){if(!isAdmin())return;const x=users().find(a=>a.id==id),p=prompt("Naya password ("+x.name+") kam az kam 4 harf:");if(!p)return;if(p.length<4)return alert("Password chhota hai");
  const h=await H(p,x.username);save("cfg","users",{rows:users().map(a=>a.id==id?Object.assign({},a,{hash:h}):a)});alert("Password badal gaya")}
function delUser(id){if(!isAdmin())return;const x=users().find(a=>a.id==id);if(!x||x.id==me.id)return;
  if(x.role=="admin"&&users().filter(a=>a.role=="admin").length<2)return alert("Aakhri Admin delete nahi ho sakta");if(confirm(x.name+" ko delete karein?"))save("cfg","users",{rows:users().filter(a=>a.id!=id)})}
const STAFFTABS=["exp","att","roz"];
const TABS=[["home","📊","Hisaab",home],["exp","🧾","Kharcha",kharcha],["att","🗓️","Hazri",hazri],["roz","📋","Roznamcha",roz],["sal","💰","Salary",salary],["st","👥","Staff",staffV],["set","⚙️","Settings",sett],["usr","🔐","Users",usersV]];
function render(force){const f=document.activeElement;if(!force&&f&&/INPUT|SELECT|TEXTAREA/.test(f.tagName))return;
  if(!users().length){$("#app").innerHTML=setupV();$("#nav").innerHTML="";return}
  if(me)me=users().find(u=>u.id==me.id)||null;
  if(!me){$("#app").innerHTML=loginV();$("#nav").innerHTML="";return}
  today=T0();if(!isAdmin()){ad=rd=today;ym=today.slice(0,7)}
  const T=TABS.filter(x=>isAdmin()||STAFFTABS.indexOf(x[0])>=0);if(!T.some(x=>x[0]==tab))tab=T[0][0];const t=T.find(x=>x[0]==tab);
  $("#app").innerHTML='<div class="bar np"><span>👤 '+E(me.name)+' ('+(isAdmin()?"Admin":"Staff")+')</span><span id="clk" style="font-weight:600;color:var(--pr)">'+fmtNow()+'</span><button class="g" onclick="logout()">Logout</button></div>'+t[3]();
  if(tab=="roz"&&classes().length)rozUpd();
  $("#nav").innerHTML=T.map(x=>`<a class="${x[0]==tab?"on":""}" onclick="tab='${x[0]}';render(true);scrollTo(0,0)"><b>${x[1]}</b>${x[2]}</a>`).join("")}
render(true);
setInterval(()=>{const e=document.getElementById("clk");if(e)e.textContent=fmtNow();if(T0()!=today)render()},1000);
Object.keys(localStorage).forEach(k=>{if(k.indexOf("sx:")==0){const p=k.slice(3).split("/");try{S[p[0]][p[1]]=JSON.parse(localStorage.getItem(k))}catch(e){}}});const sid=sessionStorage.getItem("sx_sess")||localStorage.getItem("sx_sess");me=users().find(u=>u.id==sid)||null;render(true);
</script></body></html>
